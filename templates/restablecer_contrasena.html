<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}?v={{ asset_version('login.css') }}">
</head>
<body>
  <div class="container-fluid h-100">
    <div class="row h-100">

      <div class="col-md-6 left-side">
        <img src="{{ url_for('static', filename='imagenes/logo.png') }}" alt="Logo" class="mb-3" style="max-width: 150px;">
        <h1 class="fw-bold">AportAR</h1>
        <p>Plataforma solidaria de intercambio local</p>
      </div>

      <div class="col-md-6 right-side">
        <div class="login-box shadow p-4 rounded bg-white">
          <h2 class="mb-4 text-center">Nueva contraseña</h2>

          {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
          {% endif %}

          <form method="POST" action="{{ url_for('restablecer_contrasena', token=token) }}">
            <div class="mb-3">
              <label for="nueva" class="form-label">Nueva contraseña</label>
              <input type="password" class="form-control" id="nueva" name="nueva" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="mb-3">
              <label for="confirmar" class="form-label">Confirmar contraseña</label>
              <input type="password" class="form-control" id="confirmar" name="confirmar" placeholder="Repetí la contraseña" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">Guardar nueva contraseña</button>
          </form>

          <div class="mt-3 text-center">
            <a href="{{ url_for('login') }}">Volver a iniciar sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
