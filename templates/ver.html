{% extends "base.html" %}

{% block title %}Ver Donaciones - AportAR{% endblock %}

{% block content %}
<div class="ver-page">
<h2>Donaciones Disponibles</h2>
<div class="filtros-bar">
    <div class="filtro-grupo filtro-buscador">
        <label for="buscador-donaciones">Buscar</label>
        <input type="text" id="buscador-donaciones" class="buscador-input" placeholder="Buscar donaciones...">
    </div>
    <div class="filtro-grupo">
        <label for="filtro-distrito-donaciones">Distrito</label>
        <select id="filtro-distrito-donaciones">
            <option value="">Todos los distritos</option>
            {% for d in distritos %}
            <option value="{{ d }}" {% if d == usuario.distrito %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filtro-grupo">
        <label for="filtro-categoria-donaciones">Categoría</label>
        <select id="filtro-categoria-donaciones">
            <option value="">Todas las categorías</option>
            {% for c in categorias %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filtro-grupo">
        <label for="orden-donaciones">Ordenar</label>
        <select id="orden-donaciones">
            <option value="recientes">Más recientes primero</option>
            <option value="antiguas">Más antiguas primero</option>
        </select>
    </div>
</div>

<div class="ver-layout">
    <section class="panel-lista">
        <div class="panel-lista-inner">
            <h3>Donaciones de vecinos</h3>
            <div id="lista"></div>
        </div>
        <div class="detalle-publicacion-box"></div>
    </section>
</div>
</div>
{% endblock %}
